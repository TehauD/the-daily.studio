<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>FORGE · Distillation Lab</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0c0c'/%3E%3Cpath d='M9 23V9h14M9 16h9' stroke='%232bb3a6' stroke-width='3' fill='none'/%3E%3C/svg%3E" />
    <script>
      // Apply UI preferences before first paint (no theme flash). Mirrors src/lib/prefs.ts.
      (function () {
        var d = document.documentElement, p = {};
        try { p = JSON.parse(localStorage.getItem("forge.ui.v1") || "{}") || {}; } catch (e) { p = {}; }
        var t = p.theme || "light";
        if (t === "system") t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        d.dataset.theme = t;
        d.dataset.accent = p.accent || "teal";
        d.dataset.density = p.density || "standard";
        d.dataset.contrast = p.contrast || "standard";
        d.dataset.grid = p.grid === false ? "off" : "on";
        d.dataset.motion = p.motion || "system";
        d.style.setProperty("--text-scale", String(p.textScale || 1));
        d.style.setProperty("--radius", (p.radius == null ? 6 : p.radius) + "px");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
