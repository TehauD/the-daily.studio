name: CodeQL
# Looks for security mistakes in the code (injection, unsafe URLs, prototype pollution, regex that can hang). Free for a public repository; the findings
# show under Security ▸ Code scanning. It reads the code only: no secrets, and the token can write nothing but its own report (2.87.2).
# Use this file OR GitHub's "default setup" for CodeQL, not both (docs/REPO_SECURITY.md).
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  schedule:
    - cron: '41 5 * * 1'      # Mondays, so a newly found pattern is checked against code that has not changed
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          category: /language:javascript-typescript
