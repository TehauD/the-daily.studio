name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Committed build outputs are up to date
        run: npm run build:check
      - name: Deploy folder builds and passes the release gate (includes the licence, provenance and network audit)
        run: npm run build:site && npm run verify:site
      - name: Install test dependencies
        run: npm ci --no-audit --no-fund
      - name: Smoke test (boots the app in jsdom, fails on any error)
        run: npm test
      - name: Stem separation benchmark (synthetic audio)
        run: npm run test:stems
  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: End-to-end flows (tunings, tour, rig deck, transcription, stems)
        run: npm run test:e2e
      - name: Phone, tablet and desktop layouts
        run: npm run test:mobile
  browsers:
    # The same app in Safari's engine (WebKit) and Firefox's: a short pass over what people rely on most (test/xbrowser.cjs).
    # New in 2.19.1 and not yet proven on hosted runners, so it reports without blocking; drop continue-on-error once it has been green.
    runs-on: ubuntu-latest
    needs: verify
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, firefox]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: The studio in ${{ matrix.browser }}
        run: node test/xbrowser.cjs
        env:
          BROWSER: ${{ matrix.browser }}
