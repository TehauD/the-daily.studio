name: Deploy to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Rebuild from src/ (so the site always matches the source)
        run: node scripts/build.mjs
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js robots.txt sitemap.xml 404.html CNAME _site/
          cp -r icons _site/icons
          if [ -d samples ]; then cp -r samples _site/samples; fi
          if [ -d journal ]; then mkdir -p _site/journal && cp journal/index.html _site/journal/; fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
