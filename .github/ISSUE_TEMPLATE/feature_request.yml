name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes: { label: What would you like to be able to do?, description: Describe the playing or practising situation first, then the feature. }
    validations: { required: true }
  - type: textarea
    id: alt
    attributes: { label: Anything you do today as a workaround? }
